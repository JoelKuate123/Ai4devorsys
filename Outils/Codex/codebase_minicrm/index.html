<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniCRM · carnet de clients</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="entete">
  <div class="marque">MiniCRM</div>
  <div class="actions-entete">
    <button id="btn-nouveau">+ Nouveau contact</button>
    <button id="btn-export" class="ghost">Exporter en CSV</button>
  </div>
</header>

<main class="page">

  <!-- Les indicateurs. Ils portent sur toute la base, pas sur le filtre. -->
  <section class="resume" id="resume"></section>

  <!-- Les filtres -->
  <section class="barre-filtres">
    <input id="filtre-recherche" type="search" placeholder="Rechercher un nom, une entreprise, une note…">
    <select id="filtre-statut"></select>
    <select id="filtre-source"></select>
    <span class="compteur" id="compteur"></span>
  </section>

  <!-- Le tableau des contacts -->
  <section class="bloc">
    <h2>Contacts</h2>
    <div id="liste"></div>
  </section>

  <div class="colonnes">
    <section class="bloc">
      <h2>Performance par source</h2>
      <div id="sources"></div>
    </section>

    <section class="bloc">
      <h2>À rappeler <span class="sous-titre">sans contact depuis 90 jours</span></h2>
      <div id="dormants"></div>
    </section>
  </div>

</main>

<!-- Le formulaire, masqué par défaut.
     On utilise l'attribut « hidden » plutôt que style.display : c'est
     la façon standard, et les lecteurs d'écran la comprennent. -->
<div class="voile" id="panneau-formulaire" hidden>
  <form class="formulaire" id="formulaire">
    <h2 id="titre-formulaire">Nouveau contact</h2>

    <div class="grille-form">
      <div class="champ">
        <label for="champ-nom">Nom *</label>
        <input id="champ-nom" type="text" autocomplete="off">
      </div>
      <div class="champ">
        <label for="champ-email">Adresse e-mail *</label>
        <input id="champ-email" type="text" autocomplete="off">
      </div>
      <div class="champ">
        <label for="champ-entreprise">Entreprise</label>
        <input id="champ-entreprise" type="text" autocomplete="off">
      </div>
      <div class="champ">
        <label for="champ-statut">Statut</label>
        <select id="champ-statut"></select>
      </div>
      <div class="champ">
        <label for="champ-source">Source</label>
        <select id="champ-source"></select>
      </div>
      <div class="champ">
        <label for="champ-montant">Montant (€)</label>
        <input id="champ-montant" type="number" step="0.01" min="0">
      </div>
      <div class="champ">
        <label for="champ-dateContact">Dernier contact</label>
        <input id="champ-dateContact" type="date">
      </div>
      <div class="champ large">
        <label for="champ-notes">Notes</label>
        <textarea id="champ-notes" rows="3"></textarea>
      </div>
    </div>

    <div class="actions-form">
      <button type="submit">Enregistrer</button>
      <button type="button" id="btn-annuler" class="ghost">Annuler</button>
    </div>
  </form>
</div>

<div class="annonce" id="annonce" hidden></div>

<!-- L'ordre de chargement compte : chaque fichier utilise les précédents. -->
<script src="js/modele.js"></script>
<script src="js/depot.js"></script>
<script src="js/statistiques.js"></script>
<script src="js/vue.js"></script>
<script src="js/donnees-demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
