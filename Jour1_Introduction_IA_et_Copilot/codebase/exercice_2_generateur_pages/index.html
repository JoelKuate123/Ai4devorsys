<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercice 2 · Générateur de pages web</title>
<style>
  :root{--accent:#0E8C86;--accent2:#0B6E68;--navy:#0B2D48;--text:#16212B;
        --text2:#4B5C63;--card:#EAF4F3;--border:#D7E6E4;--warn:#B9740A;--good:#1F9D67;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#F2F7F7;color:var(--text);
       padding:1.6rem 1.2rem 4rem;}
  .wrap{max-width:1100px;margin:0 auto;}
  h1{font-size:1.6rem;color:var(--navy);margin-bottom:.3rem;}
  .sub{color:var(--text2);font-size:.95rem;margin-bottom:1.3rem;}
  .config{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;margin-bottom:1.2rem;}
  .config h2{font-size:.95rem;color:var(--accent2);margin-bottom:.7rem;}
  .rangee{display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.7rem;}
  .champ{display:flex;flex-direction:column;gap:.25rem;flex:1;min-width:180px;}
  label{font-size:.8rem;color:var(--text2);font-weight:600;}
  input,select,textarea{padding:.5rem .65rem;border:1px solid var(--border);border-radius:7px;
                        font-family:inherit;font-size:.9rem;background:#fff;color:var(--text);}
  textarea{min-height:4.5rem;resize:vertical;line-height:1.5;}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.6rem 1.2rem;
         font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;}
  button:hover{background:var(--accent2);}
  button:disabled{opacity:.5;cursor:wait;}
  button.ghost{background:#fff;color:var(--accent2);border:1px solid var(--border);}
  .colonnes{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
  .panneau{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .panneau h3{font-size:.85rem;background:var(--card);color:var(--accent2);padding:.55rem .9rem;
              text-transform:uppercase;letter-spacing:.08em;}
  iframe{width:100%;height:460px;border:none;background:#fff;}
  pre{margin:0;padding:.9rem;background:#0F2733;color:#E8F1F0;font-size:.72rem;line-height:1.5;
      overflow:auto;height:460px;font-family:'JetBrains Mono',Consolas,monospace;white-space:pre-wrap;}
  .controle{margin-top:1rem;padding:.8rem 1rem;border-radius:8px;font-size:.88rem;line-height:1.6;}
  .controle.ok{background:#EEF9F3;border-left:4px solid var(--good);color:var(--text2);}
  .controle.ko{background:#FFF6E8;border-left:4px solid var(--warn);color:var(--text2);}
  .etat{font-size:.85rem;color:var(--text2);margin-left:.6rem;}
  @media(max-width:820px){.colonnes{grid-template-columns:1fr;}iframe,pre{height:320px;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Exercice 2 · Générer une page web à partir d'un prompt</h1>
  <p class="sub">
    Sans clé d'API et sans LM Studio, la page bascule automatiquement en
    <b>mode hors ligne</b> : l'exercice fonctionne quand même.
  </p>

  <div class="config">
    <h2>1 · Connexion au modèle</h2>
    <div class="rangee">
      <div class="champ">
        <label for="baseUrl">Adresse du serveur</label>
        <input id="baseUrl" type="text" value="http://localhost:1234/v1">
      </div>
      <div class="champ">
        <label for="apiKey">Clé d'API (laisser vide pour LM Studio ou le mode hors ligne)</label>
        <input id="apiKey" type="password" placeholder="sk-...">
      </div>
      <div class="champ" style="max-width:180px">
        <label for="modele">Modèle</label>
        <input id="modele" type="text" value="local-model">
      </div>
    </div>

    <h2>2 · Votre demande</h2>
    <div class="rangee">
      <div class="champ" style="flex:2">
        <label for="description">Décrivez la page voulue</label>
        <textarea id="description">une page d'accueil pour un club de sport de quartier, avec les horaires et un formulaire de contact</textarea>
      </div>
      <div class="champ" style="max-width:150px">
        <label for="couleur">Couleur dominante</label>
        <input id="couleur" type="text" value="vert profond">
      </div>
      <div class="champ" style="max-width:150px">
        <label for="ton">Ton</label>
        <select id="ton">
          <option>sobre et professionnel</option>
          <option>chaleureux et familial</option>
          <option>dynamique et jeune</option>
        </select>
      </div>
    </div>
    <div class="rangee">
      <button id="btnGenerer">Générer la page</button>
      <button id="btnPrompt" class="ghost">Voir le prompt envoyé</button>
      <span class="etat" id="etat"></span>
    </div>
  </div>

  <div class="colonnes">
    <div class="panneau">
      <h3>Aperçu</h3>
      <!-- sandbox="" : le HTML généré s'affiche sans pouvoir exécuter de script
           ni accéder à cette page. On ne fait jamais confiance à une sortie de modèle. -->
      <iframe id="apercu" sandbox=""></iframe>
    </div>
    <div class="panneau">
      <h3>Code produit</h3>
      <pre id="codeSource">(rien pour l'instant)</pre>
    </div>
  </div>

  <div class="controle ok" id="controle" style="display:none"></div>
</div>

<script src="../../../_commun/llm-client.js"></script>
<script src="generateur-pages.js"></script>
<script>
/* --------------------------------------------------------------------------
 * Le code d'interface. La logique métier est dans generateur-pages.js.
 * ------------------------------------------------------------------------ */

const el = function (id) { return document.getElementById(id); };

/** Recopie les champs de la page dans la configuration du client LLM. */
function appliquerConfig() {
  LLM.configurer({
    baseUrl: el('baseUrl').value.trim(),
    apiKey: el('apiKey').value.trim(),
    modele: el('modele').value.trim() || 'local-model'
  });
}

/** Rassemble les contraintes saisies par l'utilisateur. */
function contraintes() {
  return {
    couleur: el('couleur').value.trim(),
    ton: el('ton').value
  };
}

el('btnPrompt').addEventListener('click', function () {
  const p = GenerateurPages.construirePrompt(el('description').value.trim(), contraintes());
  // On montre le message système ET la demande : les participants doivent
  // voir que le prompt réel est bien plus long que ce qu'ils ont tapé.
  el('codeSource').textContent =
    '--- MESSAGE SYSTÈME ---\n' + GenerateurPages.MESSAGE_SYSTEME +
    '\n\n--- DEMANDE ---\n' + p;
});

el('btnGenerer').addEventListener('click', async function () {
  appliquerConfig();

  const bouton = el('btnGenerer');
  bouton.disabled = true;
  el('etat').textContent = LLM.estHorsLigne()
    ? 'Mode hors ligne — réponse préparée à l\'avance…'
    : 'Appel du modèle en cours…';

  const debut = Date.now();
  const resultat = await GenerateurPages.genererPage(el('description').value.trim(), contraintes());
  const duree = Date.now() - debut;

  bouton.disabled = false;
  el('etat').textContent = 'Terminé en ' + duree + ' ms.';

  if (!resultat.succes) {
    el('codeSource').textContent = 'ÉCHEC : ' + (resultat.erreur || 'raison inconnue');
    el('apercu').srcdoc = '';
    el('controle').style.display = 'block';
    el('controle').className = 'controle ko';
    el('controle').textContent = resultat.erreur || 'Le modèle n\'a rien produit d\'exploitable.';
    return;
  }

  // srcdoc affiche du HTML sans passer par un fichier ni par un serveur.
  el('apercu').srcdoc = resultat.html;
  el('codeSource').textContent = resultat.html;

  const c = resultat.controle;
  const zone = el('controle');
  zone.style.display = 'block';
  zone.className = 'controle ' + (c.valide ? 'ok' : 'ko');
  zone.innerHTML = c.valide
    ? '<b>Contrôle qualité : 7/7.</b> Le modèle a respecté toutes les contraintes du message système.'
    : '<b>Contrôle qualité : ' + c.points + '/7.</b> Contraintes ignorées :<ul style="margin:.4rem 0 0 1.2rem">'
      + c.problemes.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>';
});
</script>
</body>
</html>
