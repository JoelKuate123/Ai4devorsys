<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma page — à remplacer</title>

<style>
  /* ---------------------------------------------------------------------
     Ce fichier est un GABARIT. Il ne fait rien d'utile en l'état.

     Ce qu'il faut faire :
       1. sélectionner tout le contenu de ce fichier (Ctrl+A) ;
       2. l'effacer ;
       3. coller le code produit par le modèle ;
       4. enregistrer sous le nom  ma-page.html  (Fichier > Enregistrer sous).

     Le squelette ci-dessous est là pour une seule raison : vous montrer
     à quoi ressemble le minimum vital d'une page web. Les quatre lignes
     du <head> sont les quatre premiers contrôles de la grille.
     --------------------------------------------------------------------- */

  body {
    font-family: system-ui, sans-serif;
    line-height: 1.6;
    max-width: 700px;
    margin: 0 auto;
    padding: 3rem 1.2rem;
    color: #16212B;
  }
  h1 { color: #0B2D48; }
  .rappel {
    background: #EAF4F3;
    border-left: 4px solid #0E8C86;
    padding: .9rem 1.1rem;
    border-radius: 6px;
    color: #4B5C63;
  }
</style>
</head>

<body>

  <h1>Gabarit — à remplacer</h1>

  <div class="rappel">
    Effacez tout ce fichier, collez le code produit par le modèle,
    puis enregistrez sous <b>ma-page.html</b>.
  </div>

</body>
</html>
